name: iOSPlayground
options:
  bundleIdPrefix: com.devin.iosplayground
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  iOSPlayground:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devin.iosplayground
        PRODUCT_NAME: iOSPlayground
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Playground
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  iOSPlaygroundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: iOSPlayground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devin.iosplayground.tests
        GENERATE_INFOPLIST_FILE: YES
  iOSPlaygroundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: iOSPlayground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devin.iosplayground.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  iOSPlayground:
    build:
      targets:
        iOSPlayground: all
        iOSPlaygroundTests: [test]
        iOSPlaygroundUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - iOSPlaygroundTests
        - iOSPlaygroundUITests
